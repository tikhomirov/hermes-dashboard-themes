name: filament
label: Filament (Amber)
description: Modern admin aesthetic inspired by Laravel Filament 3/4 with amber accents, dark slate cards, and DM Sans
palette:
  background: '#090d16'
  midground: '#f8fafc'
  foreground: '#ffffff'
  warmGlow: 'rgba(245, 158, 11, 0.4)'
  noiseOpacity: 0.0
typography:
  fontUrl: 'https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap'
  fontSans: "'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  fontMono: "'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
  baseSize: '15px'
  lineHeight: '1.6'
  letterSpacing: '-0.01em'
layout:
  radius: '0.75rem'
  density: comfortable
layoutVariant: standard
colorOverrides:
  card: 'rgba(15, 23, 42, 0.6)'
  cardForeground: '#f8fafc'
  popover: 'rgba(15, 23, 42, 0.95)'
  popoverForeground: '#f8fafc'
  primary: '#f59e0b'
  primaryForeground: '#000000'
  secondary: 'rgba(255, 255, 255, 0.06)'
  secondaryForeground: '#f8fafc'
  muted: 'rgba(255, 255, 255, 0.04)'
  mutedForeground: '#94a3b8'
  accent: 'rgba(245, 158, 11, 0.12)'
  accentForeground: '#f59e0b'
  border: 'rgba(255, 255, 255, 0.07)'
  input: 'rgba(255, 255, 255, 0.05)'
  ring: '#f59e0b'
  success: '#10b981'
  warning: '#f59e0b'
customCSS: |
  /* Filament aesthetic */
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap');

  :root {
    --filament-canvas: #090d16;
    --filament-panel: rgba(15, 23, 42, 0.65);
    --filament-sidebar: rgba(11, 17, 30, 0.92);
    --filament-line: rgba(255, 255, 255, 0.07);
    --filament-line-strong: rgba(255, 255, 255, 0.12);
    --filament-amber: #f59e0b;
    --filament-amber-glow: rgba(245, 158, 11, 0.2);
  }

  html, body, #root {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    background-color: var(--filament-canvas) !important;
    color: #f8fafc !important;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.04) 0%, transparent 55%), #090d16 !important;
  }

  /* Smooth scrollbars */
  * {
    scrollbar-width: thin !important;
    scrollbar-color: rgba(255, 255, 255, 0.12) transparent !important;
  }
  ::-webkit-scrollbar {
    width: 6px !important;
    height: 6px !important;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12) !important;
    border-radius: 9999px !important;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25) !important;
  }

  /* Sidebar */
  aside#app-sidebar {
    background: var(--filament-sidebar) !important;
    backdrop-filter: blur(24px) !important;
    -webkit-backdrop-filter: blur(24px) !important;
    border-right: 1px solid var(--filament-line) !important;
  }

  aside#app-sidebar a,
  aside#app-sidebar button {
    border-radius: 0.625rem !important;
    font-weight: 500 !important;
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  aside#app-sidebar a:hover {
    background: rgba(255, 255, 255, 0.05) !important;
    color: #f8fafc !important;
  }

  aside#app-sidebar a.active,
  aside#app-sidebar a[aria-current="page"] {
    background: rgba(245, 158, 11, 0.12) !important;
    color: #f59e0b !important;
    font-weight: 600 !important;
    border: 1px solid rgba(245, 158, 11, 0.22) !important;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.08) !important;
  }

  /* Header */
  header {
    background: rgba(11, 17, 30, 0.85) !important;
    backdrop-filter: blur(16px) !important;
    border-bottom: 1px solid var(--filament-line) !important;
  }

  /* Cards */
  .bg-card,
  div[class*="bg-card"] {
    background: var(--filament-panel) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid var(--filament-line) !important;
    border-radius: 0.875rem !important;
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03) !important;
    transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
  }

  .bg-card:hover,
  div[class*="bg-card"]:hover {
    border-color: var(--filament-line-strong) !important;
    box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(245, 158, 11, 0.12) !important;
  }

  /* Inputs */
  input, textarea, select {
    background: rgba(255, 255, 255, 0.04) !important;
    border: 1px solid var(--filament-line) !important;
    border-radius: 0.625rem !important;
    color: #f8fafc !important;
    transition: all 0.15s ease !important;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #f59e0b !important;
    outline: none !important;
    box-shadow: 0 0 0 3px var(--filament-amber-glow) !important;
    background: rgba(255, 255, 255, 0.06) !important;
  }
